<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codejoueur</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
    }
    h1, h2 { text-align: center; }
    input, button, textarea {
      width: 100%;
      max-width: 420px;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin: 6px 0;
      display: block;
    }
    input, textarea {
      background: #1e293b;
      color: white;
    }
    textarea {
      height: 180px;
      font-family: monospace;
      resize: vertical;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #475569;
    }
    #home, #lobby, #game {
      display: none;
      max-width: 480px;
      margin: 0 auto;
    }
    #home { display: block; }
    #players {
      list-style: none;
      padding: 0;
    }
    #players li {
      background: #1e293b;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
    }
    #status {
      text-align: center;
      color: #94a3b8;
      margin-top: 16px;
      font-size: 14px;
    }
    #result {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .success { background: #166534; }
    .error { background: #7f1d1d; }
    #statement {
      background: #1e293b;
      padding: 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-bottom: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Codejoueur</h1>

  <!-- Accueil -->
  <div id="home">
    <input type="text" id="playerName" placeholder="Ton pseudo" maxlength="15">
    <button id="createBtn">Créer une salle</button>
    <input type="text" id="roomCodeInput" placeholder="Code de la salle">
    <button id="joinBtn">Rejoindre</button>
  </div>

  <!-- Lobby -->
  <div id="lobby">
    <h2>Salle : <span id="currentRoom"></span></h2>
    <p>Joueurs :</p>
    <ul id="players"></ul>
    <button id="startBtn" style="display:none; background:#22c55e;">Lancer la partie</button>
    <button id="leaveBtn" style="background:#ef4444;">Quitter</button>
  </div>

  <!-- Écran de jeu -->
  <div id="game">
    <h2 id="problemTitle">Manche</h2>
    <div id="statement"></div>
    <textarea id="codeArea" placeholder="Écris ton code ici..."></textarea>
    <button id="submitBtn">Soumettre</button>
    <div id="result"></div>
  </div>

  <p id="status">Connexion...</p>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io("https://codejoueur-backend.onrender.com");

    const statusEl = document.getElementById("status");
    const home = document.getElementById("home");
    const lobby = document.getElementById("lobby");
    const game = document.getElementById("game");
    const playersList = document.getElementById("players");
    const currentRoomEl = document.getElementById("currentRoom");
    const startBtn = document.getElementById("startBtn");
    const resultEl = document.getElementById("result");

    let myRoom = null;
    let isHost = false;

    socket.on("connect", () => {
      statusEl.textContent = "Connecté";
    });

    socket.on("playerJoined", (players) => {
      updatePlayers(players);
    });

    socket.on("gameStarted", (problem) => {
      home.style.display = "none";
      lobby.style.display = "none";
      game.style.display = "block";

      document.getElementById("problemTitle").textContent = problem.title;
      document.getElementById("statement").textContent = problem.statement;
      document.getElementById("codeArea").value = "function add(a, b) {\n  // ton code ici\n}";
      statusEl.textContent = "Manche en cours";
    });

    function updatePlayers(players) {
      playersList.innerHTML = "";
      players.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.name;
        playersList.appendChild(li);
      });
    }

    function showLobby(roomCode, players, host = false) {
      myRoom = roomCode;
      isHost = host;
      home.style.display = "none";
      lobby.style.display = "block";
      currentRoomEl.textContent = roomCode;
      updatePlayers(players);
      startBtn.style.display = host ? "block" : "none";
    }

    document.getElementById("createBtn").onclick = () => {
      const name = document.getElementById("playerName").value.trim() || "Joueur";
      socket.emit("createRoom", { playerName: name }, (res) => {
        if (res.success) {
          showLobby(res.roomCode, res.players, true);
          statusEl.textContent = "Salle créée - tu es l'hôte";
        }
      });
    };

    document.getElementById("joinBtn").onclick = () => {
      const name = document.getElementById("playerName").value.trim() || "Joueur";
      const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
      if (!code) return alert("Entre un code de salle");

      socket.emit("joinRoom", { roomCode: code, playerName: name }, (res) => {
        if (res.success) {
          showLobby(code, res.players, false);
          statusEl.textContent = "Tu as rejoint la salle";
        } else {
          alert(res.message);
        }
      });
    };

    startBtn.onclick = () => {
      if (myRoom && isHost) {
        socket.emit("startGame", { roomCode: myRoom });
      }
    };

    document.getElementById("submitBtn").onclick = () => {
      const code = document.getElementById("codeArea").value;
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Vérification...";

      socket.emit("submitSolution", { roomCode: myRoom, code }, (res) => {
        btn.disabled = false;
        btn.textContent = "Soumettre";

        resultEl.style.display = "block";
        resultEl.textContent = res.message;
        resultEl.className = res.success ? "success" : "error";
      });
    };

    document.getElementById("leaveBtn").onclick = () => location.reload();
  </script>
</body>
</html>
